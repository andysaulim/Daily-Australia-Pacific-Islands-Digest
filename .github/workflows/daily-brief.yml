name: Australia Chair Daily Brief

on:
  schedule:
    # Safety-net fallbacks. The intended primary trigger is an external cron
    # (cron-job.org) firing workflow_dispatch at 6:00 AM ET on weekdays; see
    # SETUP step 8. Until that exists these ARE the delivery mechanism, which
    # they were never meant to be.
    #
    # Six slots, not two, because GitHub's scheduler does not keep time.
    # Measured on this repo:
    #   26 Aug   11:30 slot fired 11:52 (+22m),  13:00 slot fired 13:54 (+54m)
    #   27 Aug   11:30 slot fired 21:03 (+9.6h), 13:00 slot fired 22:50 (+9.8h)
    #   28 Aug   neither slot had fired 3h after the first was due
    # A 9.6 hour delay turns a morning brief into an evening one. Spreading the
    # attempts does not make any single slot punctual, but it means one late
    # slot no longer decides the day: the guard runs the first that arrives and
    # every later one costs about eight seconds to skip itself.
    #
    # Delivery is 7 AM ET, seven days a week, matching the other three
    # editions. Times are UTC and GitHub does NOT adjust for daylight saving:
    # these are set for EDT (UTC-4), so 11:00 is 7:00 AM ET, and from November
    # they land an hour earlier in ET. The EARLIEST_SEND_HOUR_ET floor in the
    # guard below is evaluated in ET, so it holds across the change and an
    # early slot simply no-ops rather than mailing the list at 6.
    - cron: '10 11 * * *'    # 7:10 AM ET, just after the external primary
    - cron: '40 11 * * *'    # 7:40 AM ET
    - cron: '40 12 * * *'    # 8:40 AM ET
    - cron: '40 13 * * *'    # 9:40 AM ET, last resort
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Send even outside the 7 AM ET delivery window. The external cron posts no inputs, so it is unaffected.'
        type: boolean
        default: false
      send_to:
        description: >-
          Test send: deliver this run to these addresses only, comma-separated.
          Leave blank for the normal distribution list. Skips the archive and
          tracker writes, so a test leaves no trace in the published history.
        type: string
        default: ''
      replace_today:
        description: >-
          Regenerate today's issue. Hides today's own publications from the
          cross-day memory, so a second run is not stripped bare by the first.
          Recipients get another email. Leave off for the normal daily send.
        type: boolean
        default: false

# The built-in GITHUB_TOKEN covers everything this workflow does, so no
# personal access token is needed to run the brief. actions:read is what
# lets the double-send guard call `gh run list`.
permissions:
  contents: write
  pages: write
  actions: read

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  send-brief:
    runs-on: ubuntu-latest
    # 45, not 30. Run 3 on 25 August spent 22 of its 30 minutes and was
    # still on validation attempt 3. The tier-1 window is now 160 items
    # rather than 90, and the raised word floor makes a second generation
    # attempt more likely, so the old budget had no headroom left.
    #
    # Measured against the real corpus in data/archive.db: the tier-1
    # block goes from ~22k to ~39k tokens, but the rest of the user
    # prompt, the baselines, three trackers, calendar, cross-day memory
    # and schema, is a further ~10k that does not grow at all. The whole
    # user prompt therefore grows ~53%, not the ~78% a first estimate
    # gave by dividing the entire prompt across tier-1's items alone.
    # 76% is right for the tier-1 block; it is not right for the prompt.
    #
    # A timeout kill is the worst failure this pipeline has: the run is
    # marked failed, which is exactly what a fallback cron reads as
    # licence to send a second copy.
    timeout-minutes: 45
    steps:
      # Checkout first. The guard below reads last_sent.txt out of the
      # repository, and before a checkout there is neither a working tree nor
      # a git remote to read it from: placed ahead of the guard, both the git
      # show and its working-tree fallback failed silently, the marker always
      # read empty, and every fallback cron concluded nothing had been sent
      # and ran the whole pipeline again. The checkout is seconds; the guard
      # still runs before Python, the dependencies and the browser.
      - uses: actions/checkout@v4

      # Guard: on a fallback cron, skip if a dispatch already sent today.
      - name: Check if already sent today
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Earliest hour this brief may reach the list, in ET. Nothing that
          # mails the list runs before it, whatever started the run: the
          # external cron has dispatched around midnight ET and this edition
          # went out at 00:00 on 9 September. A send_to test address is exempt
          # (it never reaches the list), as is an explicit force_send.
          # SIX, not seven, and deliberately so until the external cron moves.
          # This repo's GitHub crons run about four hours late, every day
          # (10:00 UTC fired at 14:04, 10:30 at 14:45, and so on), so they have
          # never been what delivered the 6 AM brief. The punctual trigger is
          # the external cron-job.org dispatch at 10:00 UTC = 6:00 ET. Setting
          # the floor to 7 on 10 September rejected that dispatch and left only
          # the late crons, and the brief did not go out in the morning at all.
          # A floor of 6 still blocks the midnight-ET dispatch this was added
          # for. To move delivery to 7 AM properly: repoint the cron-job.org
          # job at 11:00 UTC, THEN set the EARLIEST_SEND_HOUR_ET repo variable
          # to 7. Raising the floor before moving the job breaks the send.
          EARLIEST_ET="${{ vars.EARLIEST_SEND_HOUR_ET || '6' }}"
          HOUR_ET=$(TZ=America/New_York date +%-H)
          if [ "$HOUR_ET" -lt "$EARLIEST_ET" ] \
             && [ -z "${{ inputs.send_to }}" ] \
             && [ "${{ inputs.force_send }}" != "true" ]; then
            echo "::notice::${HOUR_ET}:00 ET is before the ${EARLIEST_ET}:00 ET earliest send — skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY_ET_EARLY=$(TZ=America/New_York date +%Y-%m-%d)
          git fetch -q origin "${GITHUB_REF_NAME:-main}" 2>/dev/null || true
          SENT_EARLY=$(git show "origin/${GITHUB_REF_NAME:-main}:last_sent.txt" 2>/dev/null | tr -d '[:space:]' || true)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            # A dispatch used to send unconditionally. The external cron fires
            # through this path, so a second dispatch on the same day mailed the
            # list twice — the fault the Japan edition hit on 9 September, when
            # four copies went out. A test address and force_send still bypass.
            if [ "$SENT_EARLY" = "$TODAY_ET_EARLY" ] \
               && [ -z "${{ inputs.send_to }}" ] \
               && [ "${{ inputs.force_send }}" != "true" ]; then
              echo "::notice::Today's edition ($TODAY_ET_EARLY) already went to the list — skipping. Re-run with force_send to override."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Dispatch trigger, running"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Was the LIST already mailed today? Read the marker the send writes,
          # from the remote rather than this checkout, which may predate it.
          # Counting completed runs instead — which is what this did — cannot
          # tell a run that sent from a run that skipped, and a run rejected by
          # the floor above still concludes "success".
          TODAY_ET=$(TZ=America/New_York date +%Y-%m-%d)
          git fetch -q origin "${GITHUB_REF_NAME:-main}" 2>/dev/null || true
          LAST_SENT=$(git show "origin/${GITHUB_REF_NAME:-main}:last_sent.txt" 2>/dev/null | tr -d '[:space:]' || true)
          [ -n "$LAST_SENT" ] || LAST_SENT=$(tr -d '[:space:]' < last_sent.txt 2>/dev/null || true)
          # Still worth knowing whether one is in flight, so two slots that land
          # together do not both send.
          today=$(date -u +%Y-%m-%d)
          inprogress_count=$(gh run list --repo ${{ github.repository }} \
            --workflow "Australia Chair Daily Brief" \
            --status in_progress --created "$today" \
            --json conclusion -q 'length' 2>/dev/null || echo "0")
          success_count=0
          [ "$LAST_SENT" = "$TODAY_ET" ] && success_count=1
          total=$((success_count + inprogress_count))
          if [ "$total" -gt "1" ]; then
            echo "A run already succeeded or is in flight, skipping fallback"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ "$success_count" -gt "0" ]; then
            echo "Dispatch already succeeded today, skipping fallback"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful run yet today, running fallback"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      # Between install and send, so a regression stops the run instead of
      # reaching the list. NOT continue-on-error: a failing check is a reason
      # to hold the brief, which is the whole point of having one.
      - name: Offline smoke tests
        if: steps.guard.outputs.should_run == 'true'
        run: python3 smoke_test.py

      # The suite above is a hard gate on the send, so it must not be able to
      # fail with the calendar. This runs it a year out. continue-on-error:
      # a time bomb a year away is worth a red run, never a held brief.
      - name: Suite is time-independent
        continue-on-error: true
        run: python3 timetravel.py 365 smoke_test.py

      # Chromium for the PDF export. continue-on-error because a browser
      # that will not install is a missing convenience, not a reason to skip
      # the morning brief: pdf_export.py checks and degrades on its own.
      - name: Install Chromium for PDF export
        if: steps.guard.outputs.should_run == 'true'
        continue-on-error: true
        run: python -m playwright install --with-deps chromium

      # The visual check: contrast, typeface count and horizontal overflow,
      # measured in a real browser. None of it is visible by reading the
      # HTML, which is why it kept being found by eye instead. Needs the
      # browser installed below, so it runs after that step.
      # continue-on-error, deliberately. This measures contrast, type size and
      # overflow in a real browser: worth knowing, worth a red run, but NOT
      # worth a missing brief. On 11 September the Korea edition cancelled its
      # send because a weekly data update populated a caption that had always
      # been 9px at 2.55:1. The check was right; blocking the brief over it was
      # not. The offline suite above stays blocking, since it tests the
      # pipeline's own invariants and the day's news cannot trip it.
      - name: Visual checks
        if: steps.guard.outputs.should_run != 'false'
        continue-on-error: true
        run: |
          python3 preview.py
          BRIEF_HTML=preview.html python3 test_render_visual.py

      - name: Generate and send the brief
        if: steps.guard.outputs.should_run == 'true'
        id: send
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          if [ "${{ inputs.replace_today }}" = "true" ]; then
            python run.py --replace-today
          elif [ -n "${{ inputs.send_to }}" ]; then
            echo "::notice::TEST SEND to ${{ inputs.send_to }} — not archived or tracked."
            python run.py --send-to "${{ inputs.send_to }}" --no-track
          else
            python run.py
          fi

      # A real record that the list was mailed, as opposed to a run merely
      # finishing. The guard used to infer one from the other, which held only
      # while every run that got past it went on to send. The earliest-send
      # floor broke that: on 10 September the 6:00 ET dispatch was rejected by
      # the floor, the job still concluded "success", and the guard counted it
      # as the day's send — so every later cron stood down and the brief never
      # went out. A test send to a single address is not a send to the list and
      # deliberately does not write this.
      # The send marker is what stops a second copy going out, so it is pushed
      # on its own, immediately, and not bundled with the rest of the state.
      # The combined commit below carries data/, README and metrics as well;
      # a conflict or a failure in any of those would take the marker with it,
      # and the run still concludes success because that step is
      # continue-on-error by design. Then the next fallback cron reads a marker
      # that predates today and mails the list again.
      #
      # Alone, this push touches one small file that only this workflow ever
      # writes, so there is nothing for it to conflict with.
      - name: Record the send
        id: record
        # Surfaces a failed marker push without halting the job: the archive
        # deploy and the tracker commit still run, and the alert below fires.
        # Losing the day's archive on top of a transient push failure would be
        # a second fault caused by reporting the first.
        continue-on-error: true
        if: ${{ steps.send.outcome == 'success' && steps.guard.outputs.should_run == 'true' && inputs.send_to == '' }}
        run: |
          TZ=America/New_York date +%Y-%m-%d > last_sent.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_sent.txt
          if git diff --cached --quiet; then
            echo "Marker already reads $(cat last_sent.txt), nothing to push"
            exit 0
          fi
          git commit -m "Sent $(cat last_sent.txt) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" \
              && git push origin "HEAD:${GITHUB_REF_NAME:-main}" && exit 0
            sleep $((i * 4))
          done
          # Reaching here means the list was mailed and the record of it did
          # not reach the remote. Fail loudly: a fallback cron would otherwise
          # read a stale marker and send today's issue a second time.
          echo "::error::Sent, but could not push last_sent.txt — a fallback may re-send"
          exit 1

      # Everything past the send is continue-on-error on purpose. A red
      # post-send step would mark the run failed and let a fallback cron
      # send a second copy of an issue that already went out.
      # The rendered issue otherwise exists only in recipients' inboxes,
      # because public/ is gitignored. Keeping the HTML and the digest JSON as
      # artifacts makes an issue auditable after the fact even if Pages is off.
      - name: Upload the rendered issue
        if: always() && steps.guard.outputs.should_run == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: brief-${{ github.run_number }}
          path: |
            latest.html
            digest.json
            collected.json
          retention-days: 30
          if-no-files-found: warn

      - name: Update README with run stats
        if: steps.guard.outputs.should_run == 'true'
        continue-on-error: true
        run: python update_readme.py

      - name: Deploy the archive to GitHub Pages
        if: steps.guard.outputs.should_run == 'true'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true

      # The cross-day memory and the trackers live in data/ and are the
      # reason this brief does not repeat itself. They have to survive the
      # runner, so they are committed back to main rather than cached.
      - name: Commit archive, trackers, and stats
        if: steps.guard.outputs.should_run == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data README.md last_sent.txt 2>/dev/null || true
          [ -f metrics.jsonl ] && git add metrics.jsonl || true
          if ! git diff --cached --quiet; then
            git commit -m "Brief state: archive, trackers, stats [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep $((i * 4))
            done
          fi

      - name: Send failure alert
        if: ${{ (failure() || steps.record.outcome == 'failure')
                && steps.guard.outputs.should_run == 'true' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, smtplib
          from email.mime.text import MIMEText
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("America/New_York")).strftime("%Y-%m-%d %I:%M %p ET")
          sender = os.environ["GMAIL_USER"]
          # Alerts go to the operator, never to the distribution list.
          to = os.environ.get("ALERT_TO") or sender
          body = (
              f"The Australia Chair Daily Brief pipeline failed at {now}.\n\n"
              f"Run: {os.environ['RUN_URL']}\n\n"
              "The next fallback cron will retry automatically.\n\n"
              "If the run log shows the send succeeded but last_sent.txt could "
              "not be pushed, the opposite applies: today's issue HAS gone out, "
              "and a fallback may send it a second time. Push the marker by "
              "hand, or disable today's remaining runs."
          )
          msg = MIMEText(body)
          msg["Subject"] = f"Australia Chair Daily Brief FAILED, {now}"
          msg["From"] = sender
          msg["To"] = to
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=15) as s:
              s.login(sender, os.environ["GMAIL_APP_PASS"])
              s.sendmail(sender, [a.strip() for a in to.split(",") if a.strip()],
                         msg.as_string())
          print("Failure alert sent")
          PY
