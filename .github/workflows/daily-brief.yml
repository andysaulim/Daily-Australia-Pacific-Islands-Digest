name: Australia Chair Daily Brief

on:
  schedule:
    # Safety-net fallbacks. The intended primary trigger is an external cron
    # (cron-job.org) firing workflow_dispatch at 6:00 AM ET on weekdays; see
    # SETUP step 8. Until that exists these ARE the delivery mechanism, which
    # they were never meant to be.
    #
    # Six slots, not two, because GitHub's scheduler does not keep time.
    # Measured on this repo:
    #   26 Aug   11:30 slot fired 11:52 (+22m),  13:00 slot fired 13:54 (+54m)
    #   27 Aug   11:30 slot fired 21:03 (+9.6h), 13:00 slot fired 22:50 (+9.8h)
    #   28 Aug   neither slot had fired 3h after the first was due
    # A 9.6 hour delay turns a morning brief into an evening one. Spreading the
    # attempts does not make any single slot punctual, but it means one late
    # slot no longer decides the day: the guard runs the first that arrives and
    # every later one costs about eight seconds to skip itself.
    #
    # Times are UTC and GitHub does NOT adjust for daylight saving. These are
    # set for EDT (UTC-4), so 10:00 is 6:00 AM ET. From November they land an
    # hour earlier in ET, at 5:00 AM. Shift them an hour later for EST if that
    # matters; the guard makes an early run harmless either way.
    - cron: '0 10 * * 1-5'   # 6:00 AM ET, the intended hour
    - cron: '30 10 * * 1-5'  # 6:30 AM ET
    - cron: '0 11 * * 1-5'   # 7:00 AM ET
    - cron: '30 11 * * 1-5'  # 7:30 AM ET
    - cron: '0 12 * * 1-5'   # 8:00 AM ET
    - cron: '0 13 * * 1-5'   # 9:00 AM ET, last resort
  workflow_dispatch:
    inputs:
      replace_today:
        description: >-
          Regenerate today's issue. Hides today's own publications from the
          cross-day memory, so a second run is not stripped bare by the first.
          Recipients get another email. Leave off for the normal daily send.
        type: boolean
        default: false

# The built-in GITHUB_TOKEN covers everything this workflow does, so no
# personal access token is needed to run the brief. actions:read is what
# lets the double-send guard call `gh run list`.
permissions:
  contents: write
  pages: write
  actions: read

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  send-brief:
    runs-on: ubuntu-latest
    # 45, not 30. Run 3 on 25 August spent 22 of its 30 minutes and was
    # still on validation attempt 3. The tier-1 window is now 160 items
    # rather than 90, and the raised word floor makes a second generation
    # attempt more likely, so the old budget had no headroom left.
    #
    # Measured against the real corpus in data/archive.db: the tier-1
    # block goes from ~22k to ~39k tokens, but the rest of the user
    # prompt, the baselines, three trackers, calendar, cross-day memory
    # and schema, is a further ~10k that does not grow at all. The whole
    # user prompt therefore grows ~53%, not the ~78% a first estimate
    # gave by dividing the entire prompt across tier-1's items alone.
    # 76% is right for the tier-1 block; it is not right for the prompt.
    #
    # A timeout kill is the worst failure this pipeline has: the run is
    # marked failed, which is exactly what a fallback cron reads as
    # licence to send a second copy.
    timeout-minutes: 45
    steps:
      # Guard: on a fallback cron, skip if a dispatch already sent today.
      - name: Check if already sent today
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Dispatch trigger, running"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          success_count=$(gh run list --repo ${{ github.repository }} \
            --workflow "Australia Chair Daily Brief" \
            --status success --created "$today" \
            --json conclusion -q 'length' 2>/dev/null || echo "0")
          inprogress_count=$(gh run list --repo ${{ github.repository }} \
            --workflow "Australia Chair Daily Brief" \
            --status in_progress --created "$today" \
            --json conclusion -q 'length' 2>/dev/null || echo "0")
          total=$((success_count + inprogress_count))
          if [ "$total" -gt "1" ]; then
            echo "A run already succeeded or is in flight, skipping fallback"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ "$success_count" -gt "0" ]; then
            echo "Dispatch already succeeded today, skipping fallback"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful run yet today, running fallback"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.should_run == 'true'

      - name: Set up Python
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      # Chromium for the PDF export. continue-on-error because a browser
      # that will not install is a missing convenience, not a reason to skip
      # the morning brief: pdf_export.py checks and degrades on its own.
      - name: Install Chromium for PDF export
        if: steps.guard.outputs.should_run == 'true'
        continue-on-error: true
        run: python -m playwright install --with-deps chromium

      - name: Generate and send the brief
        if: steps.guard.outputs.should_run == 'true'
        id: send
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          if [ "${{ inputs.replace_today }}" = "true" ]; then
            python run.py --replace-today
          else
            python run.py
          fi

      # Everything past the send is continue-on-error on purpose. A red
      # post-send step would mark the run failed and let a fallback cron
      # send a second copy of an issue that already went out.
      # The rendered issue otherwise exists only in recipients' inboxes,
      # because public/ is gitignored. Keeping the HTML and the digest JSON as
      # artifacts makes an issue auditable after the fact even if Pages is off.
      - name: Upload the rendered issue
        if: always() && steps.guard.outputs.should_run == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: brief-${{ github.run_number }}
          path: |
            latest.html
            digest.json
            collected.json
          retention-days: 30
          if-no-files-found: warn

      - name: Update README with run stats
        if: steps.guard.outputs.should_run == 'true'
        continue-on-error: true
        run: python update_readme.py

      - name: Deploy the archive to GitHub Pages
        if: steps.guard.outputs.should_run == 'true'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true

      # The cross-day memory and the trackers live in data/ and are the
      # reason this brief does not repeat itself. They have to survive the
      # runner, so they are committed back to main rather than cached.
      - name: Commit archive, trackers, and stats
        if: steps.guard.outputs.should_run == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data README.md 2>/dev/null || true
          [ -f metrics.jsonl ] && git add metrics.jsonl || true
          if ! git diff --cached --quiet; then
            git commit -m "Brief state: archive, trackers, stats [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep $((i * 4))
            done
          fi

      - name: Send failure alert
        if: failure() && steps.guard.outputs.should_run == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, smtplib
          from email.mime.text import MIMEText
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("America/New_York")).strftime("%Y-%m-%d %I:%M %p ET")
          sender = os.environ["GMAIL_USER"]
          # Alerts go to the operator, never to the distribution list.
          to = os.environ.get("ALERT_TO") or sender
          body = (
              f"The Australia Chair Daily Brief pipeline failed at {now}.\n\n"
              f"Run: {os.environ['RUN_URL']}\n\n"
              "The next fallback cron will retry automatically."
          )
          msg = MIMEText(body)
          msg["Subject"] = f"Australia Chair Daily Brief FAILED, {now}"
          msg["From"] = sender
          msg["To"] = to
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=15) as s:
              s.login(sender, os.environ["GMAIL_APP_PASS"])
              s.sendmail(sender, [a.strip() for a in to.split(",") if a.strip()],
                         msg.as_string())
          print("Failure alert sent")
          PY
